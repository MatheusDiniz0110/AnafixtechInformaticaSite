# Blueprint do Render: cria o Web Service (Docker) e o PostgreSQL.
# Como aplicar: Render Dashboard > Blueprints > New Blueprint Instance > selecione este repositório.
#
# Depois do primeiro deploy, rode o seed uma única vez (veja DEPLOY.md) para preencher
# os serviços e os números da home. As migrations são aplicadas no startup porque
# Database__MigrateOnStartup=true.
services:
  - type: web
    name: anafixtech
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./AnafixtechInformaticaSite/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: anafixtech-db
          property: connectionString
      # O Render gera uma chave aleatória longa e guarda só no ambiente do serviço.
      - key: Jwt__SecretKey
        generateValue: true
      # Conta admin criada no primeiro startup. A senha NÃO fica no repositório: adicione
      # Admin__Password no painel do Render (Environment), com pelo menos 8 caracteres.
      - key: Admin__Email
        value: matheus.diniz.t@outlook.com
      - key: Admin__Password
        sync: false

databases:
  - name: anafixtech-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"
